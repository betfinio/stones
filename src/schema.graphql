query StonesRounds($address: Bytes) {
	rounds(where: { address: $address }, orderBy: round, orderDirection: desc, first: 1000) {
		round
		address
		betsAmount
		betsCount
		totalReceived
		status
		winnerSide
	}
}

query StonesRoundBets($address: Bytes, $round: BigInt) {
	bets(where: { address: $address, round_: { round: $round } }, first: 1000, orderBy: blockTimestamp, orderDirection: asc) {
		player
		amount
		amountReceived
		betAddress
		side
		blockTimestamp
	}
}

query StonesPlayerBetsByRound($address: Bytes, $round: BigInt, $player: Bytes) {
	bets(where: { address: $address, round_: { round: $round }, player: $player }, orderBy: blockTimestamp, orderDirection: desc) {
		player
		amount
		amountReceived
		betAddress
		side
		blockTimestamp
		round {
			round
		}
	}
}

query StonesPlayerBets($address: Bytes, $player: Bytes) {
	bets(where: { address: $address, player: $player }, orderBy: blockTimestamp, orderDirection: desc) {
		player
		amount
		amountReceived
		betAddress
		side
		blockTimestamp
		round {
			round
		}
	}
}

query StonesRoundsByPlayer($address: Bytes, $player: Bytes) {
	rounds(where: { address: $address, bets_: { player: $player } }, orderBy: round, orderDirection: desc) {
		round
		address
		betsAmount
		betsCount
		totalReceived
		status
		winnerSide
	}
}

query StonesWinner($address: Bytes, $round: BigInt) {
	winnerCalculateds(where: { address: $address, round: $round }) {
		side
		round
		transactionHash
	}
}

# Also used from gql/index.ts via graphql parse (keep in sync with StonesRoundOutcome there).
query StonesRoundOutcome($address: Bytes!, $round: BigInt!) {
	rounds(where: { address: $address, round: $round }, first: 1) {
		winnerSide
	}
	winnerCalculateds(where: { address: $address, round: $round }, first: 1) {
		side
	}
}
