name: Create Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  release-pr:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create PRs to prod branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in games bet; do
            echo "Creating PR for prod/$branch"
            gh pr create -B prod/$branch -H dev \
              --title "Release to prod/$branch" \
              --body 'Created by Github Action' || \
              echo "PR for prod/$branch already exists or couldn't be created, continuing..."
          done
